services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myapp}
      MYSQL_USER: ${MYSQL_USER:-myuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mypassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - myapp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  flask:
    build: ./app
    container_name: flask-container
    restart: unless-stopped
    environment:
      DB_HOST: mysql-container
      DB_USER: ${MYSQL_USER:-myuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-mypassword}
      DB_NAME: ${MYSQL_DATABASE:-myapp}
    ports:
      - "${FLASK_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - myapp-network

  nginx:
    build: ./nginx
    container_name: nginx-container
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    depends_on:
      - flask
    networks:
      - myapp-network

volumes:
  mysql_data:

networks:
  myapp-network:
    driver: bridge
